# Bump the addon version, tag that commit, publish a GitHub Release,
# and upload the packaged zip to CurseForge.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      notes:
        description: Changelog text for this version
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and changelog
        id: bump
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          python3 tools/bump_version.py --bump "${{ inputs.bump }}" --notes "$NOTES"
          version=$(sed -n 's/^## Version: *//p' Jeweled/Jeweled.toc | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Jeweled/Jeweled.toc Jeweled/Core.lua CHANGELOG.md Jeweled/Docs/CHANGELOG.md
          git commit -m "Release $VERSION"
          git tag -a "$VERSION" -m "Jeweled $VERSION"
          git push origin HEAD
          git push origin "$VERSION"

      - name: GitHub Release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver " " { show=1; next }
            show && /^## / { exit }
            show { print }
          ' CHANGELOG.md > /tmp/notes.md
          gh release create "$VERSION" --title "Jeweled $VERSION" --notes-file /tmp/notes.md

  curseforge:
    needs: release
    uses: ./.github/workflows/curseforge.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
